# Builds an installable BillScan APK on every push to main (or on demand)
# and publishes it as a GitHub Release. Latest download link:
#   https://github.com/mahboob17a/billscan/releases/latest/download/billscan.apk
#
# Test builds are signed with the standard debug key, which is fine for installing
# on your own phones. Play Store releases (Phase 5) will use a private upload key.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  # Public values (safe inside the app). The OpenAI key is NOT here; it lives in Supabase secrets.
  EXPO_PUBLIC_SUPABASE_URL: https://zjcgjhxvlzheqtpkyfxi.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_GnmB17DIgjYIj5cPFejmXw_uwzqYgYM
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: |
          set -o pipefail
          npx jest --ci 2>&1 | tee jest-output.txt || {
            echo "::error title=Unit tests failed::$(tail -c 2500 jest-output.txt | tr '\n' ' ' | tr -s ' ')"
            exit 1
          }

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk billscan.apk
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" billscan.apk \
            --title "BillScan ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Test build from commit ${GITHUB_SHA::7}. On your Android phone open: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/billscan.apk" \
            --latest
